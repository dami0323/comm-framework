server:
  port: 8082

spring:
  h2:
    console:
      enabled: true
  datasource:
    url: jdbc:h2:mem:test
    driver-class-name: org.h2.Driver
    username: test
    password: password
    # Tomcat-JDBC 설정
    tomcat:
      max-active: 20    # 최대 연결수(동시에 사용할 수 있는)
      max-idle: 10      # 최대 유휴 연결수
      min-idle: 5       # 최소 유휴 연결수
      initial-size: 5   # 초기 커넥션 수
      max-wait: 10000   # 커넥션을 얻기 위해 기다리는 최대 시간(단위: 밀리초)

    # HikariCP 설정
#    hikari:
#      maximum-pool-size: 10       # 최대 연결 수(유휴 + 사용중)
#      minimum-idle: 5             # 최소 유휴 연결수
#      connection-timeout: 30000   # 커넥션을 얻기 위해 기다리는 최대 시간(단위: 밀리초)
#      idle-timeout: 600000        # 유휴 커넥션 타임아웃(사용되지 않는 최대시간)
#      max-lifetime: 1800000       # 커넥션 수명주기(처음 생성된 시간으로부터의 수명)
#      pool-name: HikariPool
