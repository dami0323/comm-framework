<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>파일 읽기 도구</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 28px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .content-area {
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            min-height: 300px;
            max-height: 600px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            word-wrap: break-word;
            color: #333;
            line-height: 1.6;
        }

        .content-area.empty {
            display: flex;
            justify-content: center;
            align-items: center;
            color: #999;
            font-style: italic;
        }

        .status {
            margin-top: 15px;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 13px;
            display: none;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .status.loading {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
            display: block;
        }

        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #0c5460;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
            vertical-align: -2px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .info-text {
            color: #666;
            font-size: 12px;
            margin-top: 8px;
            text-align: center;
        }

        @media (max-width: 600px) {
            .input-group {
                flex-direction: column;
            }

            .container {
                padding: 25px;
            }

            h1 {
                font-size: 22px;
            }

            .content-area {
                min-height: 250px;
                max-height: 400px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📄 파일 읽기 도구</h1>
        
        <div class="input-group">
            <input 
                type="text" 
                id="filePath" 
                placeholder="파일 경로를 입력하세요 (예: C:/test/test.txt)"
                autocomplete="off"
            >
            <button id="readBtn" onclick="readFile()">읽기</button>
        </div>

        <p class="info-text">전체 경로를 입력하고 '읽기' 버튼을 클릭하세요.</p>

        <div id="status" class="status"></div>

        <div id="content" class="content-area empty">
            파일 경로를 입력하고 읽기 버튼을 클릭하세요
        </div>
    </div>

    <script>
        const filePathInput = document.getElementById('filePath');
        const readBtn = document.getElementById('readBtn');
        const contentArea = document.getElementById('content');
        const statusElement = document.getElementById('status');

        // 엔터 키로도 파일 읽기 가능
        filePathInput.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                readFile();
            }
        });

        async function readFile() {
            const path = filePathInput.value.trim();

            if (!path) {
                showStatus('파일 경로를 입력해주세요.', 'error');
                return;
            }

            // 로딩 상태 표시
            readBtn.disabled = true;
            showStatus('<span class="spinner"></span>파일을 읽는 중입니다...', 'loading');
            contentArea.classList.add('empty');
            contentArea.textContent = '로딩 중...';

            try {
                // API 호출
                const response = await fetch(`/api/files/read-lines?path=${encodeURIComponent(path)}`);

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const content = await response.text();

                if (!content || content.trim() === '') {
                    showStatus('파일이 비어있습니다.', 'success');
                    contentArea.classList.add('empty');
                    contentArea.textContent = '(파일 내용이 없습니다)';
                } else {
                    showStatus(`✓ 파일을 성공적으로 읽었습니다. (${formatFileSize(content.length)})`, 'success');
                    contentArea.classList.remove('empty');
                    contentArea.textContent = content;
                }
            } catch (error) {
                console.error('Error:', error);
                showStatus(`✗ 오류 발생: ${error.message}. 파일 경로를 다시 확인해주세요.`, 'error');
                contentArea.classList.add('empty');
                contentArea.textContent = '파일을 읽을 수 없습니다.';
            } finally {
                readBtn.disabled = false;
            }
        }

        function showStatus(message, type) {
            statusElement.innerHTML = message;
            statusElement.className = `status ${type}`;
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }
    </script>
</body>
</html>
